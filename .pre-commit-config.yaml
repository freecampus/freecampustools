default_stages:
  - pre-commit
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-json
      - id: check-toml
      - id: check-yaml
      - id: debug-statements
      - id: check-builtin-literals
      - id: check-case-conflict
      - id: check-docstring-first
      - id: detect-private-key

  - repo: local
    hooks:
      - id: prettier
        name: prettier
        entry: npx --yes prettier@3.0.2 --write
        language: system
        types_or: [json, markdown, yaml, javascript]

      - id: ruff-format
        name: ruff-format
        entry: ruff format
        language: system
        pass_filenames: true
        types:
          - python

      - id: ruff-check
        name: ruff-check
        entry: ruff check
        language: system
        pass_filenames: true
        types:
          - python

      - id: mypy
        name: mypy
        entry: mypy src
        files: ^src/freecampustools/.*\.py$
        language: system
        pass_filenames: false
        types:
          - python
