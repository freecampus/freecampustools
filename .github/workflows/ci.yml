name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  POETRY_INSTALLER_PARALLEL: "false"
  POETRY_VIRTUALENVS_CREATE: "false"
  VIRTUALENV_ACTIVATORS: "bash,python"

jobs:
  checks:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    defaults:
      run:
        shell: bash -l {0}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: conda-incubator/setup-miniconda@fc2d68f6413eb2d87b895e92f8584b5b94a10167 # v3
        with:
          miniforge-version: latest
          environment-file: conda.yaml
          channels: conda-forge,nodefaults
          activate-environment: freecampustools
          conda-solver: libmamba
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          poetry check --lock
          poetry install --extras notebook

      - name: Install Quarto for integration tests
        if: matrix.python-version == '3.12'
        run: python -m pip install quarto-cli==1.9.38

      - name: Run checks and build distributions
        run: makim all.ci
