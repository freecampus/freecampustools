[project]
name = "freecampustools"
version = "0.1.0"
description = "Reusable learning tools for FreeCampus courses."
readme = "README.md"
requires-python = ">=3.10,<4"
license = "BSD-3-Clause"
authors = [{ name = "Free Campus" }]
keywords = ["education", "quizzes", "freecampus"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Education",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Education",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.urls]
Homepage = "https://freecampus.org"
Repository = "https://github.com/freecampus/freecampustools"
Issues = "https://github.com/freecampus/freecampustools/issues"

[project.optional-dependencies]
notebook = ["ipywidgets>=8,<9"]

[build-system]
requires = ["poetry-core>=2,<3"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{ include = "freecampustools", from = "src" }]

[tool.poetry.group.dev.dependencies]
# Makim imports Click directly without declaring it.
click = "^8.4.1"
makim = "==1.29.0"
mypy = ">=1.10"
pre-commit = ">=3"
pytest = ">=8"
ruff = ">=0.6"

[tool.ruff]
line-length = 88
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "RUF"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.mypy]
python_version = "3.10"
strict = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["ipywidgets.*"]
ignore_missing_imports = true
